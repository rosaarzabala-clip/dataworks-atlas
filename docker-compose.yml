services:
  neo4j:
    image: neo4j:5-community
    container_name: lineage-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?define NEO4J_PASSWORD en .env}
    volumes:
      - ./neo4j/data:/data
    restart: unless-stopped
