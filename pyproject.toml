[project]
name = "dwgraph"
version = "0.1.0"
description = "Extract DataWorks nodes and lineage, load them into Neo4j, classify them into domains and find duplicated logic."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dwgraph = "dwgraph.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dwgraph"]
